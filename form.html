<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club Signup</title>
    <style>
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.1);
        }
        .field {
            margin-bottom: 15px;
        }
        .radio-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
<main>
<form>
    <h2>Sign Up for the Coding Club</h2>
    <p>Fill this out and we'll email you before the first meeting.</p>

<div class="field">
    <label for="search">Search past events</label>
    <input type="search" id="search" name="search">    
</div>

<div class="field">
    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" required>
</div>

<div class="row">
    <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Phone</label>
            <input type="phone" id="phone" name="phone" required>
    </div>
</div>

<div class="field">
    <label for="majors">Major"</label>
    <select id="major" name="major" required>
        <option value>Select your major</option>
        <optgroup label="Engineering">
            <option value>Electrical Engineering</option>
            <option value>Mechanical Engineering</option>
        </optgroup>
        <optgroup label="Computer Sciece">
            <option value>Computer Science</option>
            <option value>Software Engineering</option>
        </optgroup>
    </select>
</div>

<div class="field">
    <label>Membership Plan:</label>
    <div>
        <input type="radio" id="year1" name="membership" value="1-year">
        <label for="year1">1 Year</label>

        <input type="radio" id="year2" name="membership" value="2-years">
        <label for="year2">2 Years</label>
    </div>
</div>

</form>

</main>
</body>
